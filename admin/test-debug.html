<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار النظام</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px;direction:rtl}
h1{color:#10b981;margin-bottom:20px;font-size:1.3rem}
.test{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.test-name{font-weight:600;font-size:0.9rem}
.test-result{font-size:0.85rem;font-weight:700;padding:4px 12px;border-radius:6px}
.pass{background:#065f46;color:#34d399}
.fail{background:#7f1d1d;color:#fca5a5}
.wait{background:#78350f;color:#fcd34d}
.detail{color:#94a3b8;font-size:0.78rem;margin-top:4px;word-break:break-all}
#log{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:16px;margin-top:20px;font-family:monospace;font-size:0.8rem;max-height:300px;overflow-y:auto;white-space:pre-wrap}
button{background:#10b981;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit}
button:hover{background:#059669}
</style>
</head>
<body>
<h1>اختبار النظام - بنك المارية</h1>
<div id="tests"></div>
<div id="log"></div>
<button onclick="runTests()">اعادة الاختبار</button>

<script>
const tests = document.getElementById('tests');
const log = document.getElementById('log');

function addTest(name, status, detail) {
  const div = document.createElement('div');
  div.className = 'test';
  div.innerHTML = `<div><div class="test-name">${name}</div>${detail ? `<div class="detail">${detail}</div>` : ''}</div><span class="test-result ${status === 'pass' ? 'pass' : status === 'fail' ? 'fail' : 'wait'}">${status === 'pass' ? 'نجح' : status === 'fail' ? 'فشل' : 'جاري...'}</span>`;
  tests.appendChild(div);
  return div;
}

function updateTest(div, status, detail) {
  div.querySelector('.test-result').className = `test-result ${status === 'pass' ? 'pass' : 'fail'}`;
  div.querySelector('.test-result').textContent = status === 'pass' ? 'نجح' : 'فشل';
  if (detail) {
    let d = div.querySelector('.detail');
    if (!d) { d = document.createElement('div'); d.className = 'detail'; div.querySelector('.test-name').parentNode.appendChild(d); }
    d.textContent = detail;
  }
}

function addLog(msg) {
  log.textContent += msg + '\n';
  log.scrollTop = log.scrollHeight;
}

async function runTests() {
  tests.innerHTML = '';
  log.textContent = '';

  // Test 1: API connection
  var t1 = addTest('اتصال API', 'wait');
  try {
    var r = await fetch('/api/fb/poll?path=settings');
    var d = await r.json();
    if (r.ok && d.value) {
      updateTest(t1, 'pass', 'HTTP ' + r.status);
      addLog('API: OK - settings keys: ' + Object.keys(d.value).join(', '));
    } else {
      updateTest(t1, 'fail', 'HTTP ' + r.status + ' - ' + JSON.stringify(d).slice(0,100));
      addLog('API FAIL: ' + JSON.stringify(d));
    }
  } catch(e) {
    updateTest(t1, 'fail', e.message);
    addLog('API ERROR: ' + e.message);
  }

  // Test 2: Admin login
  var t2 = addTest('تسجيل دخول الأدمن', 'wait');
  try {
    var r = await fetch('/api/auth/signin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: 'admin@mbank.com', password: 'admin123'})
    });
    var d = await r.json();
    if (r.ok && d.uid) {
      updateTest(t2, 'pass', 'uid: ' + d.uid + ', role: ' + (d.claims?.role || '?'));
      addLog('LOGIN: OK - ' + d.email + ' (' + d.claims?.role + ')');
    } else {
      updateTest(t2, 'fail', 'HTTP ' + r.status + ' - ' + (d.message || JSON.stringify(d).slice(0,100)));
      addLog('LOGIN FAIL: ' + JSON.stringify(d));
    }
  } catch(e) {
    updateTest(t2, 'fail', e.message);
    addLog('LOGIN ERROR: ' + e.message);
  }

  // Test 3: Write test data
  var testId = 'browser_test_' + Date.now();
  var t3 = addTest('كتابة بيانات تجريبية', 'wait');
  try {
    var r = await fetch('/api/fb/update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        path: 'customers/' + testId,
        value: {
          username: 'browser_test',
          password: 'TestPass123',
          status: 'active',
          currentStep: 'login',
          lastPage: '/login',
          email: 'test@browser.com',
          fullName: 'اختبار متصفح',
          phone: '0501234567',
          nationalId: '123-456-789',
          governorate: 'أبوظبي',
          addressDetails: 'شارع اختبار',
          updatedAt: new Date().toISOString()
        }
      })
    });
    var d = await r.json();
    if (d.ok) {
      updateTest(t3, 'pass', 'ID: ' + testId);
      addLog('WRITE: OK - customer ' + testId);
    } else {
      updateTest(t3, 'fail', JSON.stringify(d).slice(0,100));
      addLog('WRITE FAIL: ' + JSON.stringify(d));
    }
  } catch(e) {
    updateTest(t3, 'fail', e.message);
    addLog('WRITE ERROR: ' + e.message);
  }

  // Test 4: Read test data back
  var t4 = addTest('قراءة البيانات التجريبية', 'wait');
  try {
    var r = await fetch('/api/fb/read', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: 'customers/' + testId})
    });
    var d = await r.json();
    if (d.value && d.value.username === 'browser_test' && d.value.password === 'TestPass123') {
      var fields = [];
      if (d.value.username) fields.push('username');
      if (d.value.password) fields.push('password');
      if (d.value.email) fields.push('email');
      if (d.value.fullName) fields.push('fullName');
      if (d.value.phone) fields.push('phone');
      if (d.value.nationalId) fields.push('nationalId');
      if (d.value.governorate) fields.push('governorate');
      if (d.value.addressDetails) fields.push('addressDetails');
      updateTest(t4, 'pass', fields.length + '/8 حقول: ' + fields.join(', '));
      addLog('READ: OK - ' + fields.length + ' fields found');
      addLog('DATA: ' + JSON.stringify(d.value, null, 2));
    } else {
      updateTest(t4, 'fail', 'بيانات ناقصة: ' + JSON.stringify(d.value || d).slice(0, 200));
      addLog('READ FAIL: ' + JSON.stringify(d));
    }
  } catch(e) {
    updateTest(t4, 'fail', e.message);
    addLog('READ ERROR: ' + e.message);
  }

  // Test 5: Read customers list (what admin polls)
  var t5 = addTest('قائمة العملاء (poll)', 'wait');
  try {
    var r = await fetch('/api/fb/poll?path=customers');
    var d = await r.json();
    if (d.value && typeof d.value === 'object') {
      var count = Object.keys(d.value).length;
      updateTest(t5, 'pass', count + ' عملاء');
      addLog('POLL: OK - ' + count + ' customers');
    } else {
      updateTest(t5, 'fail', 'لا توجد بيانات');
      addLog('POLL FAIL: ' + JSON.stringify(d));
    }
  } catch(e) {
    updateTest(t5, 'fail', e.message);
    addLog('POLL ERROR: ' + e.message);
  }

  // Test 6: Load Firebase bridge v2
  var t6 = addTest('تحميل Firebase Bridge v2', 'wait');
  try {
    var r = await fetch('/_nuxt/B2c1r0a0v2.js');
    var text = await r.text();
    if (r.ok && text.includes('_sendHeartbeat')) {
      updateTest(t6, 'pass', 'الملف الجديد محمل (يحتوي _sendHeartbeat)');
      addLog('BRIDGE: v2 loaded with heartbeat fix');
    } else if (r.ok) {
      updateTest(t6, 'fail', 'الملف محمل لكن بدون كود الـ heartbeat الجديد');
      addLog('BRIDGE: file loaded but missing _sendHeartbeat');
    } else {
      updateTest(t6, 'fail', 'HTTP ' + r.status);
    }
  } catch(e) {
    updateTest(t6, 'fail', e.message);
    addLog('BRIDGE ERROR: ' + e.message);
  }

  // Cleanup test data
  try {
    await fetch('/api/fb/remove', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: 'customers/' + testId})
    });
    addLog('CLEANUP: test customer removed');
  } catch(e) {
    addLog('CLEANUP ERROR: ' + e.message);
  }

  addLog('\n=== الاختبار اكتمل ===');
}

runTests();
</script>
</body>
</html>
